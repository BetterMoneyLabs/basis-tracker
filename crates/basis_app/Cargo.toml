[package]
name = "basis_app"
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"

[lib]
name = "basis_app"
path = "src/lib.rs"

[[bin]]
name = "basis-ui"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Cryptography
blake2 = { workspace = true }
generic-array = "0.14"
hex = "0.4"

# Utilities
anyhow = "1.0"

# Ergo
ergo-lib = { workspace = true }

# Config and directories
dirs = "5.0"
toml = "0.8"

# Internal
basis_cli = { path = "../basis_cli" }
basis_store = { path = "../basis_store" }
basis_core = { path = "../basis_core" }
basis_offchain = { path = "../basis_offchain" }