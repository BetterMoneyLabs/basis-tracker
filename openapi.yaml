          properties:
            data:
              $ref: '#/components/schemas/TrackerProofData'

    ApiResponseReserveProof:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReserveProofData'

    ApiResponseTrackerSignature:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TrackerSignatureResponse'

    ApiResponseRedemptionPreparation:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RedemptionPreparationResponse'

    ApiResponseRedemptionBuild:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RedemptionBuildResponse'

    ApiResponseRedemptionSubmit:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RedemptionSubmitResponse'

    ApiResponseTrackerState:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TrackerStateResponse'

    ApiResponsePendingTx:
      allOf:
