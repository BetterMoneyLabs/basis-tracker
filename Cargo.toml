[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
serde_json = { version = "1.0.108", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.37"
axum = "0.8.6"
fjall = "2"
ergo_avltree_rust = "0.1.1"
secp256k1 = "0.27"
blake2 = "0.10"
# Ergo blockchain dependencies for scanner - using compatible versions
ergo-lib = "0.29.0"
thiserror = "1.0"
reqwest = "0.11"

[patch.crates-io]
# ergo-lib 0.29.0 is not on crates.io yet. Pin the public sigma-rust develop
# revision the workspace is tested against, so a clean checkout builds and the
# tracker binary is reproducible. Bump the rev deliberately, never use a branch.
ergo-lib = { git = "https://github.com/ergoplatform/sigma-rust", rev = "8120eddd0d066c8e566e9c30507a359edad62200" }
ergotree-ir = { git = "https://github.com/ergoplatform/sigma-rust", rev = "8120eddd0d066c8e566e9c30507a359edad62200" }
ergotree-interpreter = { git = "https://github.com/ergoplatform/sigma-rust", rev = "8120eddd0d066c8e566e9c30507a359edad62200" }
# Vendored with JVM-compatible insert semantics (treats Operation::Insert as
# insert-or-update) so the Basis reserve contract can be reduced locally for
# sequential redemptions.
ergo_avltree_rust = { path = "temp/vendors/ergo_avltree_rust" }

# Arithmetic overflows in release builds must panic instead of wrapping
# (issue #15 S4: redemption accounting uses checked arithmetic; this is the
# defense-in-depth backstop).
[profile.release]
overflow-checks = true
